# Version updates: a weekly PR per ecosystem with what's new.
# Security updates (enabled in the repo settings) open their own PRs as soon as an advisory lands.
version: 2

updates:
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
    schedule:
      interval: weekly
      day: monday
    groups:
      # Aspire and the .NET/EF packages release together, so they move together
      dotnet:
        patterns: ["*"]
        update-types: [minor, patch]
      # Major versions may break things, so they get their own PR, but one for all projects
      # (without this group each major bump opens one PR per project)
      dotnet-major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # Pinned only to patch a transitive dependency of Aspire, which is built against MessagePack 2.x.
      # CI doesn't run the AppHost, so a green build wouldn't catch a break here.
      - dependency-name: MessagePack
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      frontend:
        patterns: ["*"]
        exclude-patterns: ["@angular/*", "@angular-devkit/*"]
        update-types: [minor, patch]
      frontend-major:
        patterns: ["*"]
        exclude-patterns: ["@angular/*", "@angular-devkit/*"]
        update-types: [major]
    ignore:
      # The Angular compiler uses the TypeScript JS API, which TypeScript 7 (the Go port) doesn't ship.
      # Angular declares the supported range; move TypeScript when Angular does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
