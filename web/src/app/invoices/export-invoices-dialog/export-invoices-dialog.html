<h2 mat-dialog-title>Exportar facturas</h2>

<mat-dialog-content>
  <p class="note">Solo se exportan las facturas aprobadas.</p>

  <app-client-company-picker
    [(company)]="company"
    [disabled]="exporting()"
    label="Empresa"
    hint="Déjala vacía para exportar todas las empresas."
  />

  <mat-form-field appearance="outline" class="dates">
    <mat-label>Periodo</mat-label>
    <mat-date-range-input [rangePicker]="periodPicker" [disabled]="exporting()">
      <input
        matStartDate
        placeholder="Desde"
        aria-label="Fecha desde"
        (dateInput)="from.set($event.value ?? '')"
      />
      <input
        matEndDate
        placeholder="Hasta"
        aria-label="Fecha hasta"
        (dateInput)="to.set($event.value ?? '')"
      />
    </mat-date-range-input>
    <mat-datepicker-toggle matIconSuffix [for]="periodPicker">
      <mat-icon matDatepickerToggleIcon>calendar_month</mat-icon>
    </mat-datepicker-toggle>
    <mat-date-range-picker #periodPicker />
    <mat-hint>dd/mm/aaaa · Por fecha de factura. Sin fechas, todas las facturas leídas.</mat-hint>
  </mat-form-field>
  @if (rangeError(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }

  <mat-radio-group
    aria-label="Formato"
    [value]="format()"
    [disabled]="exporting()"
    (change)="format.set($event.value)"
  >
    <mat-radio-button value="xlsx">Excel (.xlsx)</mat-radio-button>
    <mat-radio-button value="csv">CSV</mat-radio-button>
  </mat-radio-group>

  @if (error(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton mat-dialog-close [disabled]="exporting()">Cancelar</button>
  <button matButton="filled" [disabled]="!canExport()" (click)="export()">
    @if (exporting()) {
      <mat-spinner diameter="18" />
    }
    Exportar
  </button>
</mat-dialog-actions>
