<mat-toolbar>
  <a routerLink="/" class="brand">Plumy</a>
  <span class="spacer"></span>
  @if (auth.isAuthenticated()) {
    @if (activityLabel(); as label) {
      <a class="ai-activity" routerLink="/invoices" role="status" [title]="activityDetail()">
        <mat-icon class="sparkle">auto_awesome</mat-icon>
        <span class="ai-activity-label">{{ label }}</span>
      </a>
    }
    @if (firm(); as firm) {
      <span class="firm-name">{{ firm.name }}</span>
      <a matButton routerLink="/invoices" routerLinkActive="active" ariaCurrentWhenActive="page">
        <mat-icon>receipt_long</mat-icon>
        Facturas
      </a>
      <a
        matButton
        routerLink="/client-companies"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <mat-icon>business</mat-icon>
        Empresas
      </a>
      <a matButton routerLink="/team" routerLinkActive="active" ariaCurrentWhenActive="page">
        <mat-icon>group</mat-icon>
        Equipo
      </a>
    }
    <span class="user-name">{{ auth.userName() }}</span>
    <button matButton (click)="auth.logout()">
      <mat-icon>logout</mat-icon>
      Cerrar sesión
    </button>
  }
</mat-toolbar>

<main>
  <router-outlet />
</main>
