allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

# Pin: @angular/build 22.2.3 pins vite 8.3.0, vulnerable to GHSA-587h-7wmj-h5pm (launch-editor, high).
# Remove once an @angular/build release depends on vite >= 8.3.3.
overrides:
  vite: ^8.3.3
  # Pin: parse5-parser-stream 8.1.0 (via jsdom 31) needs parse5 >= 8.1.0 but declares ^8.0.0,
  # so pnpm dedupes it onto 8.0.1 and every jsdom test fails ("flushCharacters is not a function").
  # Remove once parse5-parser-stream declares the correct range.
  parse5: ^8.1.0
